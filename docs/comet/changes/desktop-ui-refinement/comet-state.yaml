    text: A17 研究组合自主而证据契约不退化 对多子问题场景，JEV
      可跨轮组合配置好的新闻、通用、文档和抓取能力；至少覆盖两种操作及实际阅读。只有摘要、抓取失败或只剩模型回答时不能冒充可靠引用；三种预算和取消均有界，报告字段与证据文件可追溯，旧
      research 模式仍通过原测试。
    result: pending
