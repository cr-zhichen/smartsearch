  - id: A11
    source: specs/desktop-windows-signing/spec.md
    text: A1 持续身份与秘密隔离 首次准备产生可复用的 Windows 签名身份，公开证书确认没有私钥，PFX
      受随机密码保护并置于仓库外的受限目录；仓库只出现公开证书和其公开元数据。GitHub Secrets
      的设置只打印名称/操作状态。后续构建核对并复用该身份；证书指纹不匹配、用途错误、到期、缺少私钥或密码错误均不能用于发布。
    result: passed
    reason:
      text: Public identity metadata is repository-only
        (`desktop/packaging/windows/smart-search.json`); documentation places
        encrypted PFX outside repo (`docs/windows-signing.md:36-44`), import
        validates pinned identity and clears secret env
        (`Import-WindowsSigningIdentity.ps1:7-43`), and both CI jobs passed 14
        signing checks (`x64.log:394`, `arm64.log:386`).
      truncated: false
  - id: A12
    source: specs/desktop-windows-signing/spec.md
    text: A2 Windows 发布物完整签名 为 x64 和 ARM64 生成签名发布物后，App EXE/DLL、冻结后端和自有安装器均带期望证书的
      Authenticode 签名和时间戳，且内容完整性检查通过；框架更新/卸载 helper
      的来源和签名按打包来源独立核对。产品名称和版本资源与构建版本一致。第三方库的签名前后摘要相同。证据必须区分本机实际构建、CI
      实际构建、静态审查和未运行项目，不能以一种架构代替另一种架构。
    result: passed
    reason:
      text: Bound x64/arm64 CI ran Required signing builds and installed-signature
        verification (`.github/workflows/desktop-build.yml:110-131`;
        `check_windows_ci.py:13-20`). Packaging validates signed Setup/owned
        files (`Package-Windows.ps1:65-112`) and both jobs completed the real
        upgrade/signature step (`x64.log:538-554`, `arm64.log:529-545`).
      truncated: false
  - id: A13
    source: specs/desktop-windows-signing/spec.md
    text: A3 异常和不受信任状态不会冒充成功
      可运行检查覆盖：缺失签名秘密、错误密码、错误证书、内容被篡改、缺失时间戳、签名工具失败。对应发布操作失败并阻止上传；秘密不出现在错误信息中。正确自签名文件在未导入信任的环境仍明确报告不受系统默认信任，不能将其写成公开可信。构建与验收不永久修改本机信任库。
    result: passed
    reason:
      text: Both CI jobs report `Signing checks passed (14)` (`x64.log:394`,
        `arm64.log:386`). The executed checker covers missing secrets, wrong
        password/certificate, no private key, content/CMS/timestamp tampering,
        signing failure, self-signed trust classification, and trust-store
        invariance (`Test-WindowsSigning.ps1:37-111`).
      truncated: false
  - id: A14
    source: specs/desktop-windows-signing/spec.md
    text: A4 流水线失败阻断且更新器能识别签名资产 现有 release 文件名校验接受两种 Windows signed 安装器，并继续校验现有
      macOS 资产与版本。旧版迁移入口能识别新 Windows 安装器；Velopack feed
      与包校验拒绝平台不符、身份不符或冲突资产，不以历史未签名资产作为正式更新回退。PR 测试不访问发布 Secrets。至少以真实 Windows
      签名构建和可运行的发布/资产检查验证；只有实际成功运行 GitHub Actions 后，才报告线上 CI 已通过。
    result: passed
    reason:
      text: Actual GitHub Actions success is bound to HEAD and requires both signed
        Windows jobs plus import/failure/build/delta/install/cleanup steps
        (`check_windows_ci.py:10-20`). Runtime `release-contracts` passed 24
        tests, while workflow prevents a Windows-only candidate from being
        treated as a release (`desktop-build.yml:65-76,140-160`).
      truncated: false
  - id: A15
    source: specs/desktop-windows-signing/spec.md
    text: A5 说明与证据保持一致 中英文下载/发布文档明确自签名、Windows 默认不信任、可能出现的首次运行提示、官方来源和证书指纹；不出现已获得
      CA/SignPath 信任或 macOS 已签名等错误声明。报告列出实际验签文件、测试结果、CI 状态以及 GUI/干净机器/ARM64
      实机等未运行边界。生成候选产物不自动发布新版本、覆盖旧发行附件或替换本机正式 App。
    result: passed
    reason:
      text: Current bilingual documentation states self-signed/default-untrusted
        behavior, official source/fingerprint, SmartScreen boundary, macOS
        non-claim, CI/GUI limits, and no release
        (`docs/windows-signing.md:5-11,30-32,64-70`; `desktop/README.md:39-45`).
      truncated: false
