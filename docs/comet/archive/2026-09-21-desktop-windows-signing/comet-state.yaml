    - id: private-boundary
      name:
        text: Private backup ACL and temporary-key cleanup
        truncated: false
      argv_display:
        - text: -NoProfile
          truncated: false
        - text: -Command
          truncated: false
        - text: |-
            $ErrorActionPreference='Stop'
            $directory=Join-Path $env:LOCALAPPDATA 'SmartSearch/signing/windows'
            $acl=Get-Acl -LiteralPath $directory
            $rules=@($acl.Access)
            $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            if(-not $acl.AreAccessRulesProtected -or $rules.Count -ne 1 -or $rules[0].IsInherited -or $rules[0].IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -ne $sid -or $rules[0].AccessControlType -ne 'Allow'){throw 'Private backup ACL is not restricted to current user'}
            foreach($file in @('smart-search.pfx','password.dpapi')){if(-not(Test-Path -LiteralPath (Join-Path $directory $file) -PathType Leaf)){throw 'Encrypted private backup missing'}}
            if(Test-Path -LiteralPath 'Cert:/CurrentUser/My/6B9599874FE6DF6BB3C53664FDEFBA3159EB62FB'){throw 'Temporary signing private key remains installed'}
            Write-Output 'Private backup ACL and temporary-key cleanup passed.'
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 527
