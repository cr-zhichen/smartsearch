    text: 单一更新动作与启动检查 WHEN 启动两次App且间隔不到24小时或手动检查，THEN
      每次启动均检查（支持更新的安装包且偏好开启），发现新版后原按钮变为下载更新；无重复检查/跳过操作阵列，下载和安装状态真实，失败可重试。
    result: passed
    reason:
      text: Windows 每个新进程激活时检查，macOS 启动时静默检查；主按钮在发现版本后变为下载更新，双语指南已同步为无常驻 24 小时 App 轮询。
      truncated: false
