    reason:
      text: Windows 保留六项 NavigationView，macOS 保留六个 Destination；概览和各功能页仍使用既有原生卡片/面板结构。
      truncated: false
  - id: A2
    source: specs/desktop-guided-setup/spec.md
    text: 统一环境入口 WHEN 在设置、Skills及业务页面查看环境状态，THEN
      不重复整套CLI管理；完整操作进入概览的本地环境区，未就绪时给清楚原因与可用的准备动作。
    result: passed
    reason:
      text: 完整 CLI 管理仅在概览的本地环境区；未就绪页指向概览。两端失效 CLI 错误已改为概览本地环境的重新检测或选择入口。
      truncated: false
  - id: A3
    source: specs/desktop-guided-setup/spec.md
    text: 发现mise全局shim及工具安装 WHEN Smart Search由mise单独管理且不在Node的npm全局prefix，THEN
      App沿shim/管理器找到实际安装并显示mise来源；探针无安装副作用，更新使用mise且保持该管理器所有权。
    result: passed
    reason:
      text: mise 全局 shim/工具解析、所有权和原管理器更新由当前实现处理；Runtime 的隔离 npm/mise 管理检查及真实 mise
        只读发现均通过。
      truncated: false
  - id: A4
    source: specs/desktop-guided-setup/spec.md
    text: 发现普通npm及多安装 WHEN Smart Search由普通npm安装，或机器有多个Node/npm/工具安装，THEN
      能找到并固定所选有效安装，手动选择可覆盖自动选择，安装/更新使用对应管理器和prefix，不覆盖其他安装或全局设置。
    result: passed
    reason:
      text: Runtime 管理检查覆盖多个 npm 安装、显式选择、失效手动路径不静默回退、含空格路径及原 prefix/manager 操作。
      truncated: false
  - id: A5
    source: specs/desktop-guided-setup/spec.md
    text: 旧格式安全兼容与可解释失败 WHEN 已有旧版包装器或损坏/不兼容安装，THEN
      不自动执行会下载Python的bootstrap；可安全确定已准备运行环境及兼容协议时连接，否则明确是旧版/不兼容/损坏并给更新或手动下载路径，不简单标作未安装。
    result: passed
    reason:
      text: 旧 wrapper 仅在 manifest 明示 smartSearchBinary=true 时才能力探针；fixture 断言旧 wrapper
        未执行，手动路径要求完整独立包与协议匹配。
      truncated: false
  - id: A6
    source: specs/desktop-guided-setup/spec.md
    text: 首次准备直到配置和测试 WHEN 没有可用环境，THEN 概览显示当前步骤及下一动作，按需引导获取Node/npm、安装/更新或定位Smart
