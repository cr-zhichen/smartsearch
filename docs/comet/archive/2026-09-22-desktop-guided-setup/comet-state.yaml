        发现、握手、停止和重连。
      truncated: false
  - id: A7
    source: specs/desktop-guided-setup/spec.md
    text: 断线和发行阻塞可以恢复 WHEN 用户进入服务商等页面但CLI不可用，或网络失败/兼容版本尚未发布，THEN
