name: Desktop packages

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - ".config/dotnet-tools.json"
      - "desktop/**"
      - "assets/branding/**"
      - "mise.toml"
      - "pyproject.toml"
      - "src/smart_search/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Validate Windows candidates only; skip macOS and release uploads"
        type: boolean
        default: false
      sign_windows:
        description: "Build self-signed Windows candidates (release_tag always requires signing)"
        type: boolean
        default: false
      release_tag:
        description: "Existing stable vX.Y.Z tag and release; build and attach verified native updates"
        default: ""
      replace_existing_assets:
        description: "Explicitly replace existing assets; never use this to silently change an installed version"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.architecture }} native update package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            python_architecture: x64
          - architecture: arm64
            runner: windows-11-arm
            python_architecture: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate release source before loading signing keys
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -and $env:WINDOWS_ONLY -eq 'true') { throw 'A release requires both Windows and macOS; leave release_tag empty for Windows candidates.' }
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version mismatch' }
            $tag = git rev-parse "$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tag -ne (git rev-parse HEAD)) { throw 'Release tag does not match the build source' }
          }
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]" "pyinstaller==6.22.3"
      - name: Test backend and client lifecycle
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Python regression failed' }
          dotnet run --project desktop/tests/BackendLifecycleCheck --configuration Release -- "${{ steps.python.outputs.python-path }}" "$env:RUNNER_TEMP/smartsearch-client-lifecycle"
          if ($LASTEXITCODE -ne 0) { throw 'Backend lifecycle check failed' }
      - name: Fetch and verify the previous framework package
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          python desktop/scripts/update_artifacts.py baseline --platform windows --architecture ${{ matrix.architecture }} --version $version --directory "$env:RUNNER_TEMP/previous-windows" --result "$env:RUNNER_TEMP/windows-baseline.json"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline lookup/download failed; this is not a first release' }
      - name: Import pinned Windows signing identity
        if: github.event_name == 'workflow_dispatch' && (inputs.sign_windows || inputs.release_tag != '')
        shell: pwsh
        env:
          SMART_SEARCH_WINDOWS_PFX_BASE64: ${{ secrets.SMART_SEARCH_WINDOWS_PFX_BASE64 }}
          SMART_SEARCH_WINDOWS_PFX_PASSWORD: ${{ secrets.SMART_SEARCH_WINDOWS_PFX_PASSWORD }}
        run: ./desktop/scripts/Import-WindowsSigningIdentity.ps1
      - name: Check signing failures and tamper rejection
        if: github.event_name == 'workflow_dispatch' && (inputs.sign_windows || inputs.release_tag != '')
        shell: pwsh
        env:
          SMART_SEARCH_WINDOWS_PFX_BASE64: ${{ secrets.SMART_SEARCH_WINDOWS_PFX_BASE64 }}
          SMART_SEARCH_WINDOWS_PFX_PASSWORD: ${{ secrets.SMART_SEARCH_WINDOWS_PFX_PASSWORD }}
        run: ./desktop/scripts/Test-WindowsSigning.ps1
      - name: Build self-contained App and Velopack packages
        shell: pwsh
        env:
          SIGNING_MODE: ${{ (inputs.sign_windows || inputs.release_tag != '') && 'Required' || 'Skip' }}
        run: |
          $buildArguments = @{ Architecture = '${{ matrix.architecture }}'; PythonPath = '${{ steps.python.outputs.python-path }}'; InstallerMode = 'Required'; SigningMode = $env:SIGNING_MODE }
          $baseline = Join-Path $env:RUNNER_TEMP 'windows-baseline.json'
          if (Test-Path -LiteralPath $baseline) {
            $previous = Get-Content -Raw -LiteralPath $baseline | ConvertFrom-Json
            if ($previous.directory) { $buildArguments.PreviousReleaseDirectory = $previous.directory }
          }
          ./desktop/scripts/Build-Windows.ps1 @buildArguments
      - name: Verify real delta update, full fallback and installed signatures
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          SIGNING_MODE: ${{ (inputs.sign_windows || inputs.release_tag != '') && 'Required' || 'Skip' }}
        run: |
          $results = @(Get-ChildItem ".desktop-artifacts/windows-$env:TARGET_ARCH-*/result.json")
          if ($results.Count -ne 1) { throw 'Expected exactly one fresh build' }
          python desktop/scripts/test_windows_updates.py $results[0].FullName --signing-mode $env:SIGNING_MODE
          if ($LASTEXITCODE -ne 0) { throw 'Native update verification failed' }
      - name: Remove only the runner signing identity
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.sign_windows || inputs.release_tag != '')
        shell: pwsh
        run: |
          $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new([IO.File]::ReadAllBytes((Join-Path $PWD 'desktop/packaging/windows/smart-search.cer')))
          $identity = "Cert:/CurrentUser/My/$($public.Thumbprint)"
          if (Test-Path -LiteralPath $identity) { Remove-Item -LiteralPath $identity -DeleteKey }
          $public.Dispose()
      - name: Stage complete Windows release assets
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-package-windows-${{ matrix.architecture }}
          path: .desktop-artifacts/windows-${{ matrix.architecture }}-*/installer/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows candidates and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-search-windows-${{ matrix.architecture }}-candidate
          path: |
            .desktop-artifacts/windows-${{ matrix.architecture }}-*/publish/
            .desktop-artifacts/windows-${{ matrix.architecture }}-*/installer/*
            .desktop-artifacts/windows-${{ matrix.architecture }}-*/result.json
            .desktop-artifacts/com.smartsearch.test.*/*.json
            .desktop-artifacts/com.smartsearch.test.*/*.log
            .desktop-artifacts/signing-check-*/result.json
          include-hidden-files: true
          retention-days: 7

  macos:
    if: ${{ !inputs.windows_only }}
    name: macOS ${{ matrix.architecture }} native update package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Preserve the SDK used to validate the PR51 native interface and icons.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ.get('RELEASE_TAG', '')
          if tag:
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
              assert tag == 'v' + json.load(open('package.json'))['version']
              assert subprocess.check_output(['git','rev-parse',tag+'^{commit}']) == subprocess.check_output(['git','rev-parse','HEAD'])
              assert Path('desktop/macos/Sources/SmartSearchDesktop/AppUpdater.swift').is_file(), 'Release source must include the native updater'
          PY
      - name: Load macOS packaging from the workflow revision
        if: inputs.release_tag != ''
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git restore --source="$WORKFLOW_SHA" -- mise.toml assets/branding desktop/scripts/build_backend.py desktop/scripts/build-macos.sh desktop/scripts/compile-macos.sh desktop/scripts/compile-macos-icon.sh desktop/scripts/check-macos-backend.sh desktop/scripts/verify_macos_dmg.py desktop/scripts/package-sparkle.sh desktop/scripts/test_sparkle_updates.py desktop/scripts/update_artifacts.py desktop/checks desktop/packaging/macos
      - name: Set up packaging tools
        uses: jdx/mise-action@v3
      - name: Install build dependencies
        run: |
          mise run desktop:macos:install
          .venv/bin/python -m pip install --disable-pip-version-check '.[dev]'
      - name: Test backend and native models
        run: |
          .venv/bin/python -m pytest -q
          swift test --package-path desktop/macos --configuration release --arch ${{ matrix.architecture }} --scratch-path .desktop-artifacts/macos-model-tests
      - name: Fetch and verify previous Sparkle archive
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(.venv/bin/python -c 'import json; print(json.load(open("package.json"))["version"])')"
          .venv/bin/python desktop/scripts/update_artifacts.py baseline --platform macos --architecture ${{ matrix.architecture }} --version "$version" --directory "$RUNNER_TEMP/previous-macos" --result "$RUNNER_TEMP/macos-baseline.json"
      - name: Prepare explicitly configured Sparkle release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          SMART_SEARCH_SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SMART_SEARCH_SPARKLE_EDDSA_PRIVATE_KEY }}
          SMART_SEARCH_SPARKLE_PUBLIC_KEY: ${{ vars.SMART_SEARCH_SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SMART_SEARCH_SPARKLE_EDDSA_PRIVATE_KEY" && test -n "$SMART_SEARCH_SPARKLE_PUBLIC_KEY"
          umask 077
          printf '%s' "$SMART_SEARCH_SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/smartsearch-sparkle-key"
          printf 'SMART_SEARCH_SPARKLE_PUBLIC_KEY=%s\n' "$SMART_SEARCH_SPARKLE_PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Build App, DMG and configured Sparkle updates
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          args=(--architecture '${{ matrix.architecture }}')
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-updates --update-key-file "$RUNNER_TEMP/smartsearch-sparkle-key" --update-public-key "$SMART_SEARCH_SPARKLE_PUBLIC_KEY")
            previous="$(.venv/bin/python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/macos-baseline.json"))["directory"] or "")')"
            if [[ -n "$previous" ]]; then args+=(--previous-release-directory "$previous"); fi
          fi
          mise run desktop:macos:build "${args[@]}"
      - name: Verify real Sparkle delta, fallback and wrong-key rejection
        run: |
          builds=(.desktop-artifacts/macos-${{ matrix.architecture }}-*/result.json)
          test "${#builds[@]}" -eq 1
          .venv/bin/python desktop/scripts/test_sparkle_updates.py "${builds[0]}"
      - name: Remove only the temporary release key
        if: always() && inputs.release_tag != ''
        run: .venv/bin/python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"smartsearch-sparkle-key").unlink(missing_ok=True)'
      - name: Stage complete macOS release assets
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-package-macos-${{ matrix.architecture }}
          path: .desktop-artifacts/macos-${{ matrix.architecture }}-*/updates/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS candidates and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-search-macos-${{ matrix.architecture }}-candidate
          path: |
            .desktop-artifacts/macos-${{ matrix.architecture }}-*/*.dmg
            .desktop-artifacts/macos-${{ matrix.architecture }}-*/result.json
            .desktop-artifacts/macos-${{ matrix.architecture }}-*/updates/*
            .desktop-artifacts/sparkle-check-*/*.json
            .desktop-artifacts/sparkle-check-*/*.log
          include-hidden-files: true
          retention-days: 7

  release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && !inputs.windows_only
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Load the release validator from the workflow revision
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git restore --source="$WORKFLOW_SHA" -- desktop/scripts/update_artifacts.py
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-packages
          merge-multiple: true
      - name: Verify every feed reference and create checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 desktop/scripts/update_artifacts.py validate --version "${RELEASE_TAG#v}" --directory release-packages
      - name: Attach verified packages before exposing update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          upload_args=()
          if [[ "$REPLACE_EXISTING_ASSETS" == true ]]; then upload_args+=(--clobber); fi
          packages=(); feeds=()
          for file in release-packages/*; do
            case "$(basename "$file")" in
              releases.*.json|appcast-*.xml) feeds+=("$file") ;;
              *) packages+=("$file") ;;
            esac
          done
          gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" "${upload_args[@]}"
          gh release upload "$RELEASE_TAG" "${feeds[@]}" --repo "$GITHUB_REPOSITORY" "${upload_args[@]}"
